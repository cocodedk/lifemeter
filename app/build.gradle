apply plugin: 'com.android.application'

// The version lives in gradle.properties, where the release workflow and F-Droid's
// checkupdates both read it. See the comment there before bumping it. The fleet's
// formula as-is: major*1_000_000 + minor*1_000 + patch, no ceiling offset — v0.1.1
// is versionCode 1001, exactly.
def appVersionName = providers.gradleProperty('VERSION_NAME').get()
def appVersionCode = providers.gradleProperty('VERSION_CODE').get().toInteger()

// Signing material only ever arrives through the environment. A missing keystore
// is not an error — it just means this is a local build, which stays unsigned.
def keystorePath = System.getenv('KEYSTORE_PATH')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def keyAliasEnv = System.getenv('KEY_ALIAS')
def keyPasswordEnv = System.getenv('KEY_PASSWORD')
def keystoreFile = (keystorePath != null && !keystorePath.trim().isEmpty()) ? rootProject.file(keystorePath) : null
def hasSigningConfig = keystoreFile != null && keystoreFile.isFile() \
    && keystorePassword != null && !keystorePassword.trim().isEmpty() \
    && keyAliasEnv != null && !keyAliasEnv.trim().isEmpty() \
    && keyPasswordEnv != null && !keyPasswordEnv.trim().isEmpty()

android {
    namespace = 'com.example.first'
    compileSdk = 34

    defaultConfig {
        applicationId = "dk.cocode.lifemeter"
        minSdk = 21
        targetSdk = 34
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        release {
            // R8 shrinks and optimises the release build. No reflection, Gson/Moshi/Retrofit
            // models, or getIdentifier() lookups exist in this app, so no keep rules are needed.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    // AGP otherwise adds a "Dependency metadata" block to the APK signing block,
    // encrypted with a key only Google Play holds. F-Droid rejects APKs that carry
    // it, and it lands in the published release APK that F-Droid verifies against.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
